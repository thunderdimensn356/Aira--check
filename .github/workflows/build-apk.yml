name: Build Aira Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Setup Cordova Project
        run: |
          cd cordova-app
          cordova platform add android || true

      - name: Copy Accessibility Service Files
        run: |
          cd cordova-app
          
          # Create required directories
          mkdir -p platforms/android/app/src/main/java/com/aira/app
          mkdir -p platforms/android/app/src/main/res/xml
          mkdir -p platforms/android/app/src/main/res/values
          
          # Copy Java service
          if [ -f native/java/AiraAccessibilityService.java ]; then
            cp native/java/AiraAccessibilityService.java platforms/android/app/src/main/java/com/aira/app/
            echo "Copied AiraAccessibilityService.java"
          fi
          
          # Copy XML config
          if [ -f native/xml/aira_accessibility_service.xml ]; then
            cp native/xml/aira_accessibility_service.xml platforms/android/app/src/main/res/xml/
            echo "Copied aira_accessibility_service.xml"
          fi
          
          # Ensure strings.xml exists
          STRINGS_FILE="platforms/android/app/src/main/res/values/strings.xml"
          if [ ! -f "$STRINGS_FILE" ]; then
            echo '<?xml version="1.0" encoding="utf-8"?>' > "$STRINGS_FILE"
            echo '<resources>' >> "$STRINGS_FILE"
            echo '    <string name="app_name">Aira</string>' >> "$STRINGS_FILE"
            echo '</resources>' >> "$STRINGS_FILE"
            echo "Created strings.xml"
          fi
          
          # Add accessibility description string if missing
          if ! grep -q "aira_accessibility_description" "$STRINGS_FILE"; then
            sed -i 's|</resources>|    <string name="aira_accessibility_description">Aira needs accessibility permission to help control the device.</string>\n</resources>|' "$STRINGS_FILE"
            echo "Added accessibility description string"
          fi
          
          # Add service to AndroidManifest if missing
          MANIFEST="platforms/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ] && ! grep -q "AiraAccessibilityService" "$MANIFEST"; then
            sed -i 's|</application>|        <service android:name=".AiraAccessibilityService" android:exported="false" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"><intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter><meta-data android:name="android.accessibilityservice" android:resource="@xml/aira_accessibility_service" /></service>\n    </application>|' "$MANIFEST"
            echo "Added Accessibility Service to AndroidManifest"
          fi

      - name: Build Debug APK
        run: |
          cd cordova-app
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aira-APK-With-Accessibility
          path: cordova-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
