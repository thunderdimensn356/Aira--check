name: Build Aira Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Generate Cordova App
        run: |
          cordova create airaApp com.aira.companion Aira
          cp -r * airaApp/www/ 2>/dev/null || true
          cd airaApp
          cordova platform add android

      - name: Build Debug APK
        run: |
          cd airaApp
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aira-App-Debug
          path: airaApp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          
