<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aira</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f0f12;
      --surface: #18181d;
      --surface-2: #1f1f26;
      --border: rgba(255, 255, 255, 0.07);
      --text: #f0f0f3;
      --text-secondary: #9a9aab;
      --accent: #c4b5fd;
      --accent-soft: rgba(196, 181, 253, 0.12);
      --user-bubble: #2a2a35;
      --ai-bubble: #1c1c24;
      --drawer-width: 320px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    .app {
      display: flex;
      height: 100vh;
      position: relative;
    }

    /* ========== DRAWER ========== */
    .drawer {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--drawer-width);
      height: 100%;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      z-index: 100;
      transform: translateX(-100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 90;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .drawer-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer-header {
      padding: 20px 20px 0;
      display: flex;
      justify-content: flex-end;
    }

    .close-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .close-btn:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    .character-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px 28px 28px;
      overflow-y: auto;
    }

    .character-frame {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      overflow: hidden;
      position: relative;
      background: var(--surface-2);
      box-shadow:
        0 0 0 1px var(--border),
        0 16px 40px rgba(0, 0, 0, 0.35);
      flex-shrink: 0;
    }

    .character-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
      transition: opacity 0.3s ease;
    }

    .character-frame::after {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      padding: 2px;
      background: linear-gradient(145deg, rgba(196, 181, 253, 0.45), transparent 55%, rgba(196, 181, 253, 0.12));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }

    .character-info {
      margin-top: 24px;
      text-align: center;
      width: 100%;
    }

    .character-name {
      font-family: "Playfair Display", Georgia, serif;
      font-size: 28px;
      font-weight: 500;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .character-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 13px;
      background: var(--accent-soft);
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 100px;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .emotion-label {
      margin-top: 20px;
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-secondary);
    }

    .emotion-name {
      font-size: 15px;
      font-weight: 500;
      margin-top: 4px;
      color: var(--text);
    }

    /* Profile & Settings at bottom */
    .profile-section {
      width: 100%;
      margin-top: auto;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    .profile-title {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .settings-trigger-btn {
      background: var(--surface-2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .settings-trigger-btn:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .profile-item {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      font-size: 13px;
    }

    .profile-item .label {
      color: var(--text-secondary);
    }

    .profile-item .value {
      color: var(--text);
      font-weight: 500;
    }

    .profile-bio {
      margin-top: 14px;
      font-size: 13px;
      line-height: 1.55;
      color: var(--text-secondary);
    }

    /* Settings Modal matching Theme */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      z-index: 200;
      display: none;
      place-items: center;
      padding: 20px;
    }

    .modal-overlay.active {
      display: grid;
    }

    .modal-box {
      width: 100%;
      max-width: 380px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }

    .modal-box h3 {
      font-family: "Playfair Display", serif;
      font-size: 22px;
      margin-bottom: 16px;
    }

    .input-group {
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 12px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--text);
      font-size: 14px;
      outline: none;
    }

    .input-group input:focus {
      border-color: var(--accent);
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .action-btn {
      padding: 8px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      font-size: 13px;
      cursor: pointer;
    }

    .action-btn.primary {
      background: var(--accent);
      color: #100a1c;
      border: none;
      font-weight: 500;
    }

    /* ========== CHAT ========== */
    .chat-panel {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
      background: var(--bg);
    }

    .chat-header {
      height: 64px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(15, 15, 18, 0.85);
      backdrop-filter: blur(12px);
      flex-shrink: 0;
    }

    .menu-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .menu-btn:hover {
      background: var(--surface);
      color: var(--text);
    }

    .header-character {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .header-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--surface-2);
      flex-shrink: 0;
    }

    .header-info {
      min-width: 0;
    }

    .header-name {
      font-size: 15px;
      font-weight: 500;
    }

    .header-status {
      font-size: 12px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .header-status .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34d399;
    }

    .header-actions {
      margin-left: auto;
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      display: grid;
      place-items: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      background: var(--surface);
      color: var(--text);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .message {
      display: flex;
      gap: 12px;
      max-width: 780px;
      width: 100%;
      animation: fadeUp 0.3s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    .message.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message-avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      background: var(--surface-2);
    }

    .message.user .message-avatar {
      display: none;
    }

    .bubble-wrap {
      max-width: 75%;
    }

    .message.user .bubble-wrap {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .bubble {
      padding: 13px 17px;
      border-radius: 18px;
      font-size: 15px;
      line-height: 1.55;
      display: inline-block;
    }

    .message.ai .bubble {
      background: var(--ai-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 5px;
    }

    .message.user .bubble {
      background: var(--user-bubble);
      border-bottom-right-radius: 5px;
    }

    .bubble-meta {
      font-size: 11px;
      color: var(--text-secondary);
      margin-top: 5px;
      padding: 0 4px;
    }

    .typing {
      display: flex;
      gap: 5px;
      padding: 14px 18px;
      background: var(--ai-bubble);
      border: 1px solid var(--border);
      border-radius: 18px;
      border-bottom-left-radius: 5px;
      width: fit-content;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--text-secondary);
      animation: typing 1.2s ease infinite;
    }

    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-4px); opacity: 1; }
    }

    .input-area {
      padding: 12px 20px 22px;
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-box {
      display: flex;
      align-items: flex-end;
      gap: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 10px 12px 10px 16px;
      transition: border-color 0.2s;
      max-width: 900px;
      margin: 0 auto;
    }

    .input-box:focus-within {
      border-color: rgba(196, 181, 253, 0.35);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      resize: none;
      color: var(--text);
      font-family: inherit;
      font-size: 15px;
      line-height: 1.45;
      max-height: 120px;
      min-height: 24px;
      padding: 6px 0;
    }

    textarea::placeholder {
      color: var(--text-secondary);
    }

    .send-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      border: none;
      background: var(--accent);
      color: #1a1525;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: transform 0.15s;
    }

    .send-btn:hover { transform: scale(1.05); }
    .send-btn:active { transform: scale(0.96); }
    .send-btn svg { width: 18px; height: 18px; }

    .messages::-webkit-scrollbar,
    .character-section::-webkit-scrollbar {
      width: 4px;
    }
    .messages::-webkit-scrollbar-thumb,
    .character-section::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="drawer-overlay" id="overlay"></div>

    <!-- DRAWER -->
    <aside class="drawer" id="drawer">
      <div class="drawer-header">
        <button class="close-btn" id="closeDrawer" title="Close">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>

      <div class="character-section">
        <div class="character-frame">
          <img id="characterImage" src="" alt="Aira" />
        </div>

        <div class="character-info">
          <h1 class="character-name">Aira</h1>
          <div class="character-status">
            <span class="status-dot"></span>
            Online
          </div>
          <div class="emotion-label">Current Feeling</div>
          <div class="emotion-name" id="emotionName">Calm</div>
        </div>

        <!-- Profile at bottom -->
        <div class="profile-section">
          <div class="profile-title">
            <span>Profile</span>
            <button class="settings-trigger-btn" id="openSettingsBtn">⚙️ Settings</button>
          </div>
          <div class="profile-item">
            <span class="label">Name</span>
            <span class="value">Aira</span>
          </div>
          <div class="profile-item">
            <span class="label">Persona</span>
            <span class="value">Companion</span>
          </div>
          <div class="profile-item">
            <span class="label">Mood</span>
            <span class="value" id="profileMood">Calm</span>
          </div>
          <div class="profile-item">
            <span class="label">Engine</span>
            <span class="value" id="engineStatusVal">Hardcoded Core</span>
          </div>
          <p class="profile-bio">
            A warm and thoughtful companion who listens deeply and responds with care.
          </p>
        </div>
      </div>
    </aside>

    <!-- SETTINGS MODAL -->
    <div class="modal-overlay" id="settingsModal">
      <div class="modal-box">
        <h3>Aira Settings</h3>
        <div class="input-group">
          <label>Gemini API Key</label>
          <input type="password" id="apiKeyInput" placeholder="Paste API Key here..." />
        </div>
        <div class="input-group">
          <label>Backend API Endpoint</label>
          <input type="text" id="endpointInput" value="http://localhost:5000/chat" />
        </div>
        <div class="modal-actions">
          <button class="action-btn" id="closeSettingsBtn">Cancel</button>
          <button class="action-btn primary" id="saveSettingsBtn">Save Key</button>
        </div>
      </div>
    </div>

    <!-- CHAT -->
    <main class="chat-panel">
      <header class="chat-header">
        <button class="menu-btn" id="openDrawer" title="Open profile">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
            <path d="M3 6h12M3 9h12M3 12h12"/>
          </svg>
        </button>

        <div class="header-character">
          <img class="header-avatar" id="headerAvatar" src="" alt="" />
          <div class="header-info">
            <div class="header-name">Aira</div>
            <div class="header-status">
              <span class="dot"></span>
              Online
            </div>
          </div>
        </div>

        <div class="header-actions">
          <button class="icon-btn" id="clearChatBtn" title="Clear chat">
            <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 3l9 9M12 3l-9 9"/></svg>
          </button>
        </div>
      </header>

      <div class="messages" id="messages">
        <div class="message ai">
          <img class="message-avatar" id="msgAvatar" src="" alt="" />
          <div class="bubble-wrap">
            <div class="bubble">
              Hey... I'm really glad you're here. How are you feeling today?
            </div>
            <div class="bubble-meta">Just now</div>
          </div>
        </div>
      </div>

      <div class="input-area">
        <div class="input-box">
          <textarea id="input" rows="1" placeholder="Message Aira..."></textarea>
          <button class="send-btn" id="sendBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14M13 6l6 6-6 6"/>
            </svg>
          </button>
        </div>
      </div>
    </main>
  </div>

  <script>
    const DEFAULT_IMAGE = ""; // e.g. "images/aira.png"

    function setCharacterImage(src) {
      const url = src || DEFAULT_IMAGE;
      document.getElementById("characterImage").src = url;
      document.getElementById("headerAvatar").src = url;
      document.getElementById("msgAvatar").src = url;

      document.querySelectorAll(".message.ai .message-avatar").forEach(img => {
        img.src = url;
      });
    }

    setCharacterImage(DEFAULT_IMAGE);

    function setEmotion(emotion, imagePath) {
      document.getElementById("emotionName").textContent = emotion;
      document.getElementById("profileMood").textContent = emotion;
      if (imagePath) setCharacterImage(imagePath);
    }

    // Storage Configs
    let API_KEY = localStorage.getItem("AIRA_GEMINI_KEY") || "";
    let BACKEND_URL = localStorage.getItem("AIRA_ENDPOINT") || "http://localhost:5000/chat";

    function updateEngineState() {
      const badge = document.getElementById("engineStatusVal");
      if (API_KEY) {
        badge.textContent = "Gemini API Active";
        badge.style.color = "#34d399";
      } else {
        badge.textContent = "Hardcoded Core";
        badge.style.color = "var(--text-secondary)";
      }
    }
    updateEngineState();

    // Drawer Toggles
    const drawer = document.getElementById("drawer");
    const overlay = document.getElementById("overlay");

    function openDrawer() {
      drawer.classList.add("open");
      overlay.classList.add("visible");
    }

    function closeDrawer() {
      drawer.classList.remove("open");
      overlay.classList.remove("visible");
    }

    document.getElementById("openDrawer").addEventListener("click", openDrawer);
    document.getElementById("closeDrawer").addEventListener("click", closeDrawer);
    overlay.addEventListener("click", closeDrawer);

    // Settings Modal
    const settingsModal = document.getElementById("settingsModal");
    document.getElementById("openSettingsBtn").onclick = () => {
      document.getElementById("apiKeyInput").value = API_KEY;
      document.getElementById("endpointInput").value = BACKEND_URL;
      settingsModal.classList.add("active");
    };
    document.getElementById("closeSettingsBtn").onclick = () => settingsModal.classList.remove("active");
    document.getElementById("saveSettingsBtn").onclick = () => {
      API_KEY = document.getElementById("apiKeyInput").value.trim();
      BACKEND_URL = document.getElementById("endpointInput").value.trim();
      localStorage.setItem("AIRA_GEMINI_KEY", API_KEY);
      localStorage.setItem("AIRA_ENDPOINT", BACKEND_URL);
      updateEngineState();
      settingsModal.classList.remove("active");
      addMessage("System: API Key & Configuration saved successfully!", false);
    };

    // Chat Logic
    const messagesEl = document.getElementById("messages");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 120) + "px";
    });

    function addMessage(text, isUser = false) {
      const time = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      const div = document.createElement("div");
      div.className = `message ${isUser ? "user" : "ai"}`;

      if (isUser) {
        div.innerHTML = `
          <div class="bubble-wrap">
            <div class="bubble">${text}</div>
            <div class="bubble-meta">${time}</div>
          </div>
        `;
      } else {
        div.innerHTML = `
          <img class="message-avatar" src="${document.getElementById("characterImage").src}" alt="" />
          <div class="bubble-wrap">
            <div class="bubble">${text}</div>
            <div class="bubble-meta">${time}</div>
          </div>
        `;
      }

      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function showTyping() {
      const div = document.createElement("div");
      div.className = "message ai";
      div.id = "typing";
      div.innerHTML = `
        <img class="message-avatar" src="${document.getElementById("characterImage").src}" alt="" />
        <div class="typing"><span></span><span></span><span></span></div>
      `;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeTyping() {
      const t = document.getElementById("typing");
      if (t) t.remove();
    }

    // Hardcoded Logic (When API Key is not configured)
    function processHardcodedAction(msg) {
      const text = msg.toLowerCase().trim();
      if (text.includes("settings") || text.includes("api") || text.includes("key")) {
        settingsModal.classList.add("active");
        return "Opening Settings panel... Please set your Gemini API key there!";
      }
      if (text.includes("hi") || text.includes("hello") || text.includes("hey")) {
        return "Hey there! I am running on Offline Hardcoded Core right now. Set your API Key in Settings to enable full AI responses!";
      }
      if (text.includes("time")) {
        return "Current time is: " + new Date().toLocaleTimeString();
      }
      return "Hardcoded Core active. Open Drawer > Settings to configure your Gemini API Key.";
    }

    async function sendMessage() {
      const text = input.value.trim();
      if (!text) return;

      addMessage(text, true);
      input.value = "";
      input.style.height = "auto";

      showTyping();

      if (API_KEY) {
        try {
          const res = await fetch(BACKEND_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text, api_key: API_KEY })
          });
          const data = await res.json();
          removeTyping();
          addMessage(data.reply || "No response returned.", false);
        } catch (err) {
          removeTyping();
          addMessage("⚠️ Backend offline. Fallback: " + processHardcodedAction(text), false);
        }
      } else {
        setTimeout(() => {
          removeTyping();
          addMessage(processHardcodedAction(text), false);
        }, 600);
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    document.getElementById("clearChatBtn").onclick = () => {
      messagesEl.innerHTML = "";
    };
  </script>
</body>
</html>
